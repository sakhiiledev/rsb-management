version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rsb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rsb_user
      POSTGRES_PASSWORD: rsb_password
      POSTGRES_DB: rsb_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsb_user -d rsb_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rsb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
